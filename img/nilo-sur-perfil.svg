<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="perfil-title">
  <title id="perfil-title">Caricatura de Nilo Sur Trío: Clara Benet con el contrabajo, Nilo Sur con la guitarra e Iván Roca con el cajón</title>
  <defs>
    <clipPath id="marco">
      <rect width="600" height="400" rx="24"/>
    </clipPath>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
