      <stop offset="0.6" stop-color="#4A2C3A"/>
      <stop offset="1" stop-color="#B8582B"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD58A"/>
      <stop offset="0.7" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <g id="nota">
      <ellipse cx="0" cy="0" rx="7" ry="5" transform="rotate(-20)"/>
      <rect x="5" y="-26" width="2.5" height="26"/>
      <path d="M7.5 -26 q10 4 8 14 q-2 -6 -8 -7 z"/>
