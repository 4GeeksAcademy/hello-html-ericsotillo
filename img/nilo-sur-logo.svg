<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Nilo Sur</title>
  <defs>
    <clipPath id="boca">
      <circle cx="60" cy="60" r="38"/>
    </clipPath>
  </defs>

  <!-- Emblema: boca de guitarra con olas y sol -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#E8A33D" stroke-width="3"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#E8A33D" stroke-width="1" stroke-dasharray="2 4"/>
  <g clip-path="url(#boca)">
    <rect x="20" y="20" width="80" height="80" fill="#1F1C2E"/>
    <circle cx="60" cy="62" r="16" fill="#E8A33D"/>
    <g fill="none" stroke="#F4EFE6" stroke-width="3" stroke-linecap="round">
      <path d="M18 68 q10 -7 20 0 t20 0 t20 0 t20 0 t20 0"/>
      <path d="M18 80 q10 -7 20 0 t20 0 t20 0 t20 0 t20 0"/>
      <path d="M18 92 q10 -7 20 0 t20 0 t20 0 t20 0 t20 0"/>
    </g>
  </g>

  <!-- Nombre -->
  <text x="132" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="6" fill="#F4EFE6">NILO <tspan fill="#E8A33D">SUR</tspan></text>
  <line x1="134" y1="84" x2="404" y2="84" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="134" y="104" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="4.2" fill="#B9B3C7">GUITARRA · FLAMENCO · JAZZ</text>
</svg>
